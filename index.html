<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basel basemap test</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><style>body{margin:0;font:16px system-ui;background:#172d35;color:white}header{padding:16px}#map{height:78vh;background:#e8eeeb}#status{padding:10px}</style></head><body><header><strong>Beyond the Official Map — Basemap test</strong><div>No fieldwork data included.</div></header><div id="map"></div><div id="status">Loading map…</div><script>const status=document.getElementById('status');try{const map=new maplibregl.Map({container:'map',center:[7.61,47.57],zoom:13,style:{version:8,sources:{swiss:{type:'raster',tiles:['https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg'],tileSize:256,attribution:'© swisstopo'}},layers:[{id:'background',type:'background',paint:{'background-color':'#e8eeeb'}},{id:'swiss',type:'raster',source:'swiss'}]}});map.addControl(new maplibregl.NavigationControl());let failed=false;map.on('error',e=>{failed=true;status.textContent='Map error: '+(e.error?.message||'Tile request failed');});map.on('idle',()=>{if(!failed)status.textContent='Map idle — check whether streets and labels are visible.';});}catch(e){status.textContent=e.message;}</script></body></html>
